name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'claude/**'

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # The Firebase config files are not in the repository (it is public);
      # they are restored here from repository secrets. Without them the
      # build fails at Firebase.initializeApp.
      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          set -e
          for var in GOOGLE_SERVICES_JSON GOOGLE_SERVICE_INFO_PLIST FIREBASE_OPTIONS_DART; do
            if [ -z "${!var}" ]; then
              echo "::error::Secret $var is empty — add it under Settings > Secrets."
              exit 1
            fi
          done
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
          echo "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/Runner.app
          zip -qq -r nur_app.ipa Payload
          ls -lh nur_app.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: nur-app-ipa
          path: build/ios/iphoneos/nur_app.ipa
          retention-days: 30
