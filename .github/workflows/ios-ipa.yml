name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'claude/**'

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/Runner.app
          zip -qq -r nur_app.ipa Payload
          ls -lh nur_app.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: nur-app-ipa
          path: build/ios/iphoneos/nur_app.ipa
          retention-days: 30
