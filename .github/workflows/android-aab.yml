name: Build Android App Bundle

# Google Play takes an .aab, not an .apk, and refuses anything signed with the
# debug key. The upload keystore therefore lives in repository secrets rather
# than in the checkout — see docs/play-release.md for how to create it and what
# to store.

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The Firebase config files are not in the repository (it is public);
      # they are restored here from repository secrets. Without them the
      # build fails at Firebase.initializeApp.
      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          set -e
          for var in GOOGLE_SERVICES_JSON FIREBASE_OPTIONS_DART; do
            if [ -z "${!var}" ]; then
              echo "::error::Secret $var is empty — add it under Settings > Secrets."
              exit 1
            fi
          done
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          echo "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Written outside the checkout so a failed build cannot leave the signing
      # key sitting in the workspace for a later step to pick up.
      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Secret $var is empty — see docs/play-release.md."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          cat > android/key.properties <<EOF
          storeFile=$keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed app bundle
        run: flutter build appbundle --release

      # Guards against the silent failure this whole job exists to prevent:
      # android/app/build.gradle.kts falls back to the debug key when
      # key.properties is missing, and a debug-signed bundle is only rejected
      # once it reaches the Play Console.
      - name: Verify the bundle is not debug-signed
        run: |
          set -e
          bundle=build/app/outputs/bundle/release/app-release.aab
          # keytool translates its own labels, so "Owner:" is only there on an
          # English runner. Match the certificate subject instead, which is not
          # localised.
          cert=$(keytool -printcert -jarfile "$bundle")
          echo "$cert" | head -4
          if echo "$cert" | grep -q 'CN=Android Debug'; then
            echo "::error::Bundle is signed with the debug key — key.properties was not picked up."
            exit 1
          fi

      - name: Clean up signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: munir-play-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
