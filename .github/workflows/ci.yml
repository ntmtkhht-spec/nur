name: CI

# The check a pull request has to pass. Everything else under
# .github/workflows builds or ships something and runs only after a merge,
# which meant a pull request was reviewed against no automated checks at all
# and a broken change was found on master rather than before it.

on:
  pull_request:
  push:
    branches:
      - master

# A second push to the same branch makes the run before it pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # main.dart imports lib/firebase_options.dart, which is not in the
      # repository — without this step the job stops at a missing file rather
      # than at anything real. Only this one file is needed: the platform
      # config files matter to a build, not to `analyze` or `test`.
      #
      # Note that secrets are withheld from a pull request opened from a fork.
      # Work on this project happens on branches of this repository, so they
      # are available; a fork-based contribution would need this reworked.
      - name: Restore Firebase configuration
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          set -e
          if [ -z "$FIREBASE_OPTIONS_DART" ]; then
            echo "::error::Secret FIREBASE_OPTIONS_DART is empty — add it under Settings > Secrets."
            exit 1
          fi
          echo "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tool/firestore_rules_test/package-lock.json

      # The Firestore emulator is a JVM process; without a JDK it exits
      # before the first test runs. 21, not the 17 the Android build uses:
      # firebase-tools 15 refuses anything older.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: tool/firestore_rules_test
        run: npm ci

      # Run from the repository root: firebase.json points at
      # firestore.rules beside it, and the test reads the same file directly,
      # so this exercises the rules that would actually be deployed.
      - name: Run rules tests
        run: >
          npx --yes firebase-tools@15 emulators:exec
          --only firestore
          --project munir-rules-test
          --config firebase.json
          "node tool/firestore_rules_test/rules_test.mjs"
